name: Update GitHub Profile

on:
  schedule:
    - cron: "17 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-profile:
    name: Generate profile assets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate GitHub statistics
        env:
          GITHUB_USERNAME: MohammedAskee
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_stats.py

      - name: Generate contribution snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: MohammedAskee

          outputs: |
            assets/github/snake-light.svg?color_snake=%231F7D53&color_dots=%23E8F3ED,%23B7E5C8,%2369C58A,%232E9B70,%231F7D53
            assets/github/snake-dark.svg?color_snake=%2308CB00&color_dots=%2317321F,%2328633A,%233E984F,%2308CB00,%2363FF5D

      - name: Show generated files
        run: |
          find assets/github -maxdepth 1 -type f -print

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/github/

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update GitHub profile"
            git push
          fi
