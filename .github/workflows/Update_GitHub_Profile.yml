name: Update GitHub Profile

on:
  schedule:
    - cron: "15 3 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:

  generate-profile-assets:

    name: Generate GitHub statistics

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pillow

      - name: Generate statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: MohammedAskee
        run: |
          python scripts/generate_profile_assets.py

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: MohammedAskee
          outputs: |
            assets/github/snake-light.svg?palette=github-light
            assets/github/snake-dark.svg?palette=github-dark&color_snake=#08CB00

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/

          if git diff --cached --quiet; then
            echo "No profile changes."
          else
            git commit -m "chore: update GitHub profile"
            git push
          fi
